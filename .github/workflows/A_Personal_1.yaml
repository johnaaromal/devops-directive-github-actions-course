name: John
on:
  workflow_dispatch: 

jobs: 
  creating_artifact:
    runs-on: ubuntu-22.04
    steps:
      - name: Create
        run: |
          echo " This is a file" >> artifact.txt
          echo " created on ${date}" >> artifact.txt
      - name : upload
        uses: actions/upload-artifact@v4
        with: 
          name: Text
          path: artifact.txt

  waiting:
    runs-on: ubuntu-22.04
    steps: 
      - name: waiting
        run: sleep 20


  download_artifact: 
    runs-on: ubuntu-22.04
    steps: 
      - name: download 
        uses: actions/download-artifact@v4
        with:
          name: Text


